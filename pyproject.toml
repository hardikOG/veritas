[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection system relies on Depends()/Query() as default
# argument values by design — not the mutable-default-argument bug B008 exists to
# catch.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["api", "core", "db", "models", "worker"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
