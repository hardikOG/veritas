databases:
  - name: veritas-postgres
    plan: free
    postgresMajorVersion: "16"

services:
  - name: veritas-api
    type: web
    runtime: docker
    plan: free
    dockerfilePath: ./docker/Dockerfile.api
    dockerContext: .
    healthCheckPath: /health
    # No preDeployCommand -- Render's own validator rejects it on free-tier
    # services ("pre-deploy command is not supported for free tier
    # services"), and free web services also don't get Shell access to run
    # it manually either. Migrations instead run automatically at container
    # startup -- see docker/Dockerfile.api's CMD.
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: veritas-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: veritas-redis
          type: keyvalue
          property: connectionString
      # Set manually in the Render dashboard -- never committed, never
      # inferred. See docs/DEPLOY.md.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LLM_MODEL
        value: claude-sonnet-4-6
      - key: EMBED_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: VECTOR_DIM
        value: "384"
      - key: RERANK_TOP_K
        value: "8"
      - key: RRF_K
        value: "60"
      - key: VERIFIER_THRESHOLD
        value: "0.62"
      - key: VERIFIER_MAX_FAILED_RATIO
        value: "0.4"
      - key: APP_NAME
        value: veritas
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      # Set manually once the Vercel frontend has a real URL (chicken-and-egg:
      # the frontend needs this API's URL first). See docs/DEPLOY_FRONTEND.md.
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  # veritas-worker is deliberately NOT deployed yet -- Render has no free
  # plan for background workers at all (confirmed against Render's own
  # docs), and creating one requires payment info on file. For a
  # portfolio/demo deployment, the free api + redis + postgres above are
  # enough to expose a live URL and validate health, search, and the
  # cite-or-refuse /ask path (which correctly refuses on an empty index
  # without needing a worker or even an LLM key). Async ingestion won't
  # actually process new uploads until this is enabled -- see
  # docs/DEPLOY.md and MANUAL_TODO.md. To enable when ready to move past
  # a demo deployment, uncomment this block and add billing in Render:
  #
  # - name: veritas-worker
  #   type: worker
  #   runtime: docker
  #   plan: starter
  #   dockerfilePath: ./docker/Dockerfile.worker
  #   dockerContext: .
  #   envVars:
  #     - key: DATABASE_URL
  #       fromDatabase:
  #         name: veritas-postgres
  #         property: connectionString
  #     - key: REDIS_URL
  #       fromService:
  #         name: veritas-redis
  #         type: keyvalue
  #         property: connectionString
  #     - key: EMBED_MODEL
  #       value: sentence-transformers/all-MiniLM-L6-v2
  #     - key: VECTOR_DIM
  #       value: "384"
  #     - key: CELERY_CONCURRENCY
  #       value: "2"
  #     - key: INGEST_MAX_RETRIES
  #       value: "5"
  #     - key: APP_NAME
  #       value: veritas
  #     - key: APP_ENV
  #       value: production
  #     - key: LOG_LEVEL
  #       value: INFO

  - name: veritas-redis
    type: keyvalue
    plan: free
    ipAllowList: []
